[project]
name = "slurm-mcp-server"
version = "0.2.0"
description = "MCP server for Slurm workload manager"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic-settings>=2.13.1",
]

[project.scripts]
slurm-mcp = "slurm_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slurm_mcp_server"]
